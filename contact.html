<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 経理インテグレート</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           RESET & BASE
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #00622f;
            --olive: #7e7b56;
            --text: #333333;
            --white: #ffffff;
            --border: #cccccc;
            --required: #e56949;
        }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text);
            background: #fff;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================================================
           ARROW ICON
        ============================================================ */
        .arrow-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; flex-shrink: 0;
        }
        .arrow-icon svg { width: 100%; height: 100%; }

        .arrow-icon-lg {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; flex-shrink: 0;
        }
        .arrow-icon-lg svg { width: 100%; height: 100%; }

        /* ============================================================
           HEADER
        ============================================================ */
        #header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: #fff;
            height: 70px;
        }

        .header-inner {
            max-width: 1440px; margin: 0 auto; height: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
        }

        .header-logo { display: block; width: 290px; height: 40px; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; object-position: left center; }

        .header-right { display: flex; align-items: center; }

        .header-nav { display: flex; align-items: center; gap: 40px; margin-right: 40px; }
        .header-nav a {
            font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 500;
            color: var(--green);
        }
        .header-nav a:hover { opacity: .7; }

        .header-cta {
            display: flex; align-items: center; gap: 8px;
            background: var(--green); color: #fff;
            font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 700;
            padding: 0 28px; height: 70px; letter-spacing: 0.03em;
            transition: opacity .2s;
        }
        .header-cta:hover { opacity: .85; }

        /* ============================================================
           PAGE HERO (下層タイトル)
        ============================================================ */
        .page-hero {
            margin-top: 70px;
            position: relative;
            height: 255px;
            overflow: hidden;
        }

        .page-hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }

        .page-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 100%);
        }

        .page-hero-content {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 130px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
        }

        .page-hero-titles {
            display: flex;
            align-items: baseline;
            gap: 24px;
        }

        .page-hero-ja {
            font-family: 'Zen Old Mincho', serif;
            font-size: 40px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .page-hero-en {
            font-family: 'Cormorant', serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .page-hero-tagline {
            font-family: 'Zen Old Mincho', serif;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        /* ============================================================
           CONTACT SECTION
        ============================================================ */
        #contact {
            padding: 80px 0 120px;
        }

        .contact-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-desc {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            line-height: 2;
            text-align: center;
            margin-bottom: 60px;
        }

        /* ============================================================
           FORM
        ============================================================ */
        .contact-form {
            width: 700px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
        }

        .form-required {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--required);
            line-height: 1;
        }

        .form-input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            padding: 0 16px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            background: #fff;
            outline: none;
            transition: border-color .2s;
            appearance: none;
        }
        .form-input:focus { border-color: var(--green); }
        .form-input::placeholder { color: var(--border); }

        .form-textarea {
            width: 100%;
            height: 260px;
            border: 1px solid var(--border);
            padding: 12px 16px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            background: #fff;
            outline: none;
            resize: vertical;
            transition: border-color .2s;
        }
        .form-textarea:focus { border-color: var(--green); }
        .form-textarea::placeholder { color: var(--border); }

        /* Radio buttons */
        .form-radio-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-radio-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .form-radio-item input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            transition: border-color .2s;
        }
        .form-radio-item input[type="radio"]:checked {
            border-color: var(--green);
            border-width: 5px;
        }

        .form-radio-item span {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
        }

        /* Checkbox */
        .form-checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-checkbox-row input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--border);
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            transition: border-color .2s, background .2s;
        }
        .form-checkbox-row input[type="checkbox"]:checked {
            background: var(--green);
            border-color: var(--green);
        }
        .form-checkbox-row input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px; top: 1px;
            width: 6px; height: 10px;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
        }

        .form-checkbox-label {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-checkbox-label a {
            color: var(--green);
            text-decoration: underline;
        }

        /* Submit button */
        .form-submit-row {
            display: flex;
            justify-content: center;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--green);
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 16px;
            font-weight: 700;
            width: 400px;
            height: 66px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: opacity .2s;
        }
        .btn-submit:hover { opacity: .85; }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

        /* ============================================================
           CTA SECTION
        ============================================================ */
        #cta {
            position: relative;
            padding: 100px 0;
            background: var(--green);
            overflow: hidden;
        }

        .cta-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center; z-index: 0;
        }
        .cta-overlay { position: absolute; inset: 0; background: rgba(0,98,47,0.75); z-index: 1; }

        .cta-container {
            position: relative; z-index: 2;
            max-width: 1440px; margin: 0 auto; padding: 0 130px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .cta-en {
            font-family: 'Cormorant', serif; font-size: 60px; font-weight: 500;
            color: #fff; line-height: 1; margin-bottom: 8px;
        }
        .cta-ja {
            font-family: 'Zen Old Mincho', serif; font-size: 28px; font-weight: 600;
            color: #fff; line-height: 1.4;
        }

        .cta-btn {
            display: inline-flex; align-items: center; gap: 12px;
            color: #fff; font-family: 'Noto Sans JP', sans-serif;
            font-size: 20px; font-weight: 500;
            border: 1.5px solid #fff; padding: 0 32px; height: 60px;
            letter-spacing: 0.03em; transition: background .2s; white-space: nowrap;
        }
        .cta-btn:hover { background: rgba(255,255,255,0.15); }

        /* ============================================================
           FOOTER
        ============================================================ */
        #footer { background: #fff; padding: 48px 0 40px; }

        .footer-inner {
            max-width: 1440px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center;
        }

        .footer-logo { display: block; width: 304px; height: auto; margin-bottom: 40px; }

        .footer-nav { display: flex; align-items: center; gap: 0; margin-bottom: 16px; }
        .footer-nav a {
            font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 500;
            color: var(--green);
        }
        .footer-nav a:hover { opacity: .7; }
        .footer-sep {
            font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500;
            color: var(--green); margin: 0 12px;
        }

        .footer-privacy {
            font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 500;
            color: var(--green); margin-bottom: 16px; display: block;
        }
        .footer-privacy:hover { opacity: .7; }

        .footer-copy {
            font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 400;
            color: var(--green);
        }
    </style>
</head>

                            type="text"
                            id="name"
                            name="name"
                            placeholder="山田 太郎"
                            required
                        >
                    </div>

                        </label>

                            class="form-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        >

                            <label class="form-radio-item">

                                <span>IPO準備について</span>
                            </label>
                            <label class="form-radio-item">
                                <input type="radio" name="category" value="internalize">
                                <span>経理内製化について</span>
                            </label>
                            <label class="form-radio-item">
                                <input type="radio" name="category" value="audit">

                            </label>
                            <label class="form-radio-item">
                                <input type="radio" name="category" value="other">
                                <span>その他</span>
                            </label>
                        </div>
                    </div>

                        <label class="form-label" for="message">
                            ご相談内容 <span class="form-required">*</span>
                        </label>

                            class="form-textarea"
                            id="message"
                            name="message"
                            placeholder="入力してください"
                            required

                    </div>

                        </div>
                    </div>

                    <!-- Submit -->
